{{- /*
Prometheus Operator objects. They are skipped when the CRDs are not installed
yet, so the app still deploys on a cluster without kube-prometheus-stack.
*/ -}}
{{- $hasMonitoring := .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
{{- if and .Values.serviceMonitor.enabled $hasMonitoring }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "stockpilot.backendName" . }}
  labels:
    {{- include "stockpilot.componentLabels" (dict "ctx" $ "component" "backend") | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "stockpilot.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
{{- if and .Values.prometheusRule.enabled $hasMonitoring }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "stockpilot.fullname" . }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: stockpilot.rules
      rules:
        - alert: StockPilotBackendDown
          expr: absent(up{job="{{ include "stockpilot.backendName" . }}"} == 1)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: No StockPilot backend pod is being scraped successfully.
        - alert: StockPilotHighErrorRate
          expr: |
            sum(rate(http_requests_total{job="{{ include "stockpilot.backendName" . }}",status="5xx"}[5m]))
              / clamp_min(sum(rate(http_requests_total{job="{{ include "stockpilot.backendName" . }}"}[5m])), 1e-9) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: More than 5% of StockPilot API requests are failing.
        - alert: StockPilotSlowRequests
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="{{ include "stockpilot.backendName" . }}"}[5m]))) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: StockPilot API p95 latency is above 500ms.
{{- end }}
{{- if .Values.grafanaDashboard.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stockpilot.fullname" . }}-dashboard
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
    {{ .Values.grafanaDashboard.labelKey }}: {{ .Values.grafanaDashboard.labelValue | quote }}
data:
  stockpilot.json: |-
    {{- .Files.Get "dashboards/stockpilot.json" | nindent 4 }}
{{- end }}
