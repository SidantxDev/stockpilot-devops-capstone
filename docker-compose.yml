# Full local stack: PostgreSQL + FastAPI backend + React/Nginx frontend.
#   docker compose up --build      -> http://localhost:3000
name: stockpilot

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpilot}
      POSTGRES_DB: ${POSTGRES_DB:-stockpilot}
    # No host port on purpose (avoids clashing with a local Postgres).
    # Inspect data with: docker compose exec postgres psql -U stockpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    image: stockpilot-backend:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stockpilot}:${POSTGRES_PASSWORD:-stockpilot}@postgres:5432/${POSTGRES_DB:-stockpilot}
      APP_ENV: docker-compose
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: local
    image: stockpilot-frontend:local
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
