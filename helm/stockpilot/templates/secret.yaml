{{- if and .Values.postgres.enabled (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stockpilot.postgresName" . }}
  labels:
    {{- include "stockpilot.componentLabels" (dict "ctx" $ "component" "database") | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.postgres.password | quote }}
{{- end }}
