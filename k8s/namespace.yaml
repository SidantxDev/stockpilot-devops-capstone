# Logical isolation for everything StockPilot runs in the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: stockpilot
  labels:
    app.kubernetes.io/part-of: stockpilot
    # Enforce the "restricted" Pod Security Standard: non-root, no privilege
    # escalation, dropped capabilities, seccomp. The Helm chart complies.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
