apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stockpilot.backendName" . }}
  labels:
    {{- include "stockpilot.componentLabels" (dict "ctx" $ "component" "backend") | nindent 4 }}
data:
  POSTGRES_HOST: {{ include "stockpilot.postgresName" . | quote }}
  POSTGRES_PORT: "5432"
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  {{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
