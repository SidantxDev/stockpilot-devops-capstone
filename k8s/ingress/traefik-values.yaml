# Traefik ingress controller (chart traefik/traefik 42.0.0).
# It implements the Ingress resource from helm/stockpilot (className: traefik).
#
#   helm upgrade --install traefik traefik/traefik -n traefik --create-namespace \
#     --version 42.0.0 -f k8s/ingress/traefik-values.yaml
ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesIngress:
    enabled: true
    # Publish the load balancer address on Ingress objects (kubectl get ingress shows it).
    publishedService:
      enabled: true
  kubernetesCRD:
    enabled: true

service:
  spec:
    type: LoadBalancer # local kind/minikube: --set service.spec.type=NodePort
  annotations:
    # On EKS this provisions an internet-facing AWS Network Load Balancer.
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 192Mi

metrics:
  prometheus:
    serviceMonitor:
      enabled: false
