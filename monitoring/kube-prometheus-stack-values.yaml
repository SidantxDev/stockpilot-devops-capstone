# Prometheus + Grafana via kube-prometheus-stack (chart 92.9.0)
#
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace --version 92.9.0 \
#     -f monitoring/kube-prometheus-stack-values.yaml
#
# Prometheus discovers the StockPilot backend through the ServiceMonitor that
# the app's Helm chart creates; Grafana loads the StockPilot dashboard from a
# ConfigMap labelled grafana_dashboard=1 (also shipped in the app chart).

# Managed control planes (EKS) don't expose these components, so scraping them
# would only show DOWN targets on the Prometheus Targets page.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors / PrometheusRules from every namespace and every
    # release, not only ones labelled for this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    scrapeInterval: 15s
    retention: 3d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

grafana:
  # Admin password is generated by the chart and stored in a Secret; read it with:
  #   kubectl -n monitoring get secret kube-prometheus-stack-grafana -o jsonpath='{.data.admin-password}' | base64 -d
  defaultDashboardsTimezone: browser
  service:
    type: ClusterIP
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
